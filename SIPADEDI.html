<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SIPADEDI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar navy tetap di kiri, area kerja krem di kanan berisi panel abu-abu; di ponsel sidebar jadi top bar. */
:root{
  --bg:#F2F1EE; --panel:#D9D9D9; --panel-line:#BEBEC4; --ink:#1B2338; --ink-2:#4A5269;
  --navy:#1A2238; --navy-2:#2B3652; --navy-line:#2C3650; --side-ink:#E9ECF5; --side-mute:#B9C0D3;
  --slate:#50597A; --yellow:#FFD45E; --field:#A3A5B5; --bar:#CCCCD2; --pill:#EDECEA;
  --chip:#BDBDC3; --chip-ink:#566078; --check:#2A3A6B;
  --ok-bg:#D3EEDF; --ok-line:#63D7A4; --bad-bg:#F1C5C5; --bad-line:#E27B7B;
  --mine-bg:#BFC4D4; --mine-line:#434C6C;
  --btn:#1A2238; --btn-ink:#fff; --icon-bg:#1A2238; --link:#2A3A6B; --danger:#C62828; --focus:#2F6BFF;
  --shadow:0 12px 32px rgba(20,28,50,.16);
  --font-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-logo:'Chakra Petch','Poppins',system-ui,sans-serif;
  --side-w:280px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131F; --panel:#1A2133; --panel-line:#2B3550; --ink:#E7EAF3; --ink-2:#A7AFC6;
    --navy:#0A0F1B; --navy-2:#19223A; --navy-line:#222C45; --side-ink:#E9ECF5; --side-mute:#9AA3BC;
    --slate:#3B4568; --yellow:#FFD45E; --field:#3A4563; --bar:#222A40; --pill:#252D45;
    --chip:#2A3350; --chip-ink:#B6BED6; --check:#7C90D8;
    --ok-bg:#16382C; --ok-line:#2F9E73; --bad-bg:#46222A; --bad-line:#B5505A;
    --mine-bg:#303958; --mine-line:#8E9BCB;
    --btn:#5266B3; --btn-ink:#fff; --icon-bg:#3B4A7E; --link:#9FB3F2; --danger:#FF7B7B; --focus:#8FB0FF;
    --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131F; --panel:#1A2133; --panel-line:#2B3550; --ink:#E7EAF3; --ink-2:#A7AFC6;
  --navy:#0A0F1B; --navy-2:#19223A; --navy-line:#222C45; --side-ink:#E9ECF5; --side-mute:#9AA3BC;
  --slate:#3B4568; --yellow:#FFD45E; --field:#3A4563; --bar:#222A40; --pill:#252D45;
  --chip:#2A3350; --chip-ink:#B6BED6; --check:#7C90D8;
  --ok-bg:#16382C; --ok-line:#2F9E73; --bad-bg:#46222A; --bad-line:#B5505A;
  --mine-bg:#303958; --mine-line:#8E9BCB;
  --btn:#5266B3; --btn-ink:#fff; --icon-bg:#3B4A7E; --link:#9FB3F2; --danger:#FF7B7B; --focus:#8FB0FF;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.3em;height:1.3em;flex:none;display:block}
.ic.o{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor}

/* ---------- Sidebar ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.sp{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:22px}
.logo{font-family:var(--font-logo);font-weight:700;font-size:32px;letter-spacing:.06em;color:#fff;text-align:center;padding-block:30px 22px;border-bottom:3px solid var(--navy-line);user-select:none}
.sec{padding-block:18px}
.sec.acc{border-bottom:3px solid var(--navy-line)}
.lab{font-size:13px;color:var(--side-mute);margin-bottom:10px}
.accwrap{position:relative}
.chip{width:100%;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px;background:var(--navy-2);border:0;border-radius:10px;color:#fff;text-align:left;transition:background .2s}
.chip:hover{background:color-mix(in srgb,var(--navy-2),#fff 9%)}
.chip b{font-weight:600;font-size:16px;flex:1}
.chip .ic{transition:transform .25s ease}
.chip[aria-expanded="true"] .ic{transform:rotate(180deg)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;background:
  radial-gradient(circle at 28% 30%,#a7d2ff 0 10%,transparent 11%),
  radial-gradient(circle at 72% 58%,#4f94ee 0 16%,transparent 17%),
  radial-gradient(circle at 38% 82%,#86bcff 0 12%,transparent 13%),
  radial-gradient(circle at 80% 20%,#2f6fd8 0 14%,transparent 15%),
  linear-gradient(135deg,#2f6fd6,#63a8f4 50%,#2a62c4)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--navy-2);border:1px solid var(--navy-line);border-radius:12px;padding:6px;z-index:5;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:pop .22s ease both;transform-origin:top center}
.menu button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;font-size:14px;color:var(--side-ink)}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu .ic{width:1.1em;height:1.1em;color:var(--yellow)}
.menu .gap{width:1.1em}
.nv{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:6px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:10px;font-size:18px;text-align:left;transition:background .2s,transform .2s}
.nv:hover{background:rgba(255,255,255,.07);transform:translateX(4px)}
.nv[aria-current="page"]{font-weight:700;color:#fff}
.nv .ic{width:1.45em;height:1.45em}
.badge{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--yellow);color:#1B2338;font-size:12px;font-weight:700;display:grid;place-items:center}
.badge.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.45)}60%{transform:scale(.92)}100%{transform:scale(1)}}

/* ---------- Area utama ---------- */
.main{padding-block:32px 64px;padding-left:34px;padding-right:max(34px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;margin-inline:auto}
.view{display:flex;flex-direction:column;gap:22px;animation:viewIn .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:24px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--slate);color:#fff;border:0;border-radius:14px;padding:12px 26px 12px 18px;font-weight:700;font-size:16px;transition:transform .2s,filter .2s}
.back .ic{width:1.1em;height:1.1em;stroke-width:2.6}
.back:hover{transform:translateX(-4px);filter:brightness(1.12)}
.back:active{transform:scale(.97)}

/* Hero */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;color:#fff;min-height:290px;padding:26px 30px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.hero-bg{position:absolute;inset:-4%;z-index:-2;background-size:cover;background-position:center;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.07) translateX(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(33,44,78,.7),rgba(15,21,40,.86))}
.hero-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.tag{background:var(--yellow);color:#1B2338;font-weight:700;font-size:14px;padding:3px 12px;border-radius:999px}
.univ{font-size:15px;color:#E9ECF5}
.brand{font-family:var(--font-logo);font-size:40px;line-height:1.1;letter-spacing:.05em}
.sub{font-weight:700;font-size:19px;margin-top:2px}
.lead{margin-top:14px;font-size:18px;line-height:1.55;max-width:60ch;color:#F1F3F9}
.hero-main>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.hero-main>:nth-child(2){animation-delay:.08s}.hero-main>:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Filter */
.filters{display:grid;grid-template-columns:minmax(0,1fr) 230px 230px;gap:14px;padding:16px;border-radius:18px}
.fld{position:relative;display:block}
.fld input,.fld select{width:100%;height:56px;background:transparent;border:2px solid var(--field);border-radius:14px;padding:0 50px 0 18px;font:inherit;font-size:17px;color:var(--ink);appearance:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s,background .2s}
.fld input::placeholder{color:var(--ink-2);opacity:.85}
.fld input:hover,.fld select:hover{border-color:var(--ink-2)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus),transparent 78%);background:color-mix(in srgb,var(--panel),#fff 14%)}
.fld select{cursor:pointer}
.fld>.ic{position:absolute;right:16px;top:50%;translate:0 -50%;width:1.5em;height:1.5em;color:var(--ink);pointer-events:none}
.fld select+.ic{width:1.3em;height:1.3em}

/* Daftar */
.list-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.list-h h2{font-size:24px;font-weight:700}
.count{background:var(--pill);color:var(--ink);font-weight:700;font-size:14px;padding:4px 16px;border-radius:999px;transition:transform .3s}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;min-height:200px}
.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--field);border-radius:22px;background:var(--panel);cursor:pointer;text-align:left;
  animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
@keyframes cardIn{from{opacity:0;transform:translate(var(--dx,0),16px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--ink-2)}
.card:active{transform:translateY(-1px) scale(.995)}
.card-img{height:196px;overflow:hidden;background:var(--bar)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .card-img img{transform:scale(1.06)}
.card-b{padding:12px 18px 12px;flex:1}
.card-b h3{font-size:20px;font-weight:700;line-height:1.3}
.loc{display:flex;align-items:center;gap:6px;font-size:15px;margin-top:2px}
.loc .ic{width:1.1em;height:1.1em;color:var(--ink-2)}
.desc{font-size:13px;line-height:1.55;margin-top:4px}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bar);padding:10px 18px;font-size:13px;border-top:1px solid var(--field)}
.cap{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.cap .ic{width:1.5em;height:1.5em;color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.go .ic{width:1.1em;height:1.1em;stroke-width:2.4;transition:transform .25s}
.card:hover .go .ic{transform:translateX(5px)}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .4s both}
.empty b{font-size:18px}
.empty p{color:var(--ink-2);max-width:42ch}
.btn-f,.btn-o{height:52px;padding:0 34px;border-radius:14px;font-weight:500;font-size:17px;border:1px solid var(--btn);transition:transform .2s,filter .2s,background .2s}
.btn-f{background:var(--btn);color:var(--btn-ink)}
.btn-o{background:transparent;color:var(--ink)}
.btn-f:hover,.btn-o:hover{transform:translateY(-2px)}
.btn-f:hover{filter:brightness(1.18)}
.btn-o:hover{background:color-mix(in srgb,var(--panel),var(--ink) 8%)}
.btn-f:active,.btn-o:active{transform:scale(.97)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.pager:empty{display:none}
.pg-info{font-size:13px;color:var(--ink-2)}
.pg-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pg{display:inline-flex;align-items:center;gap:6px;height:42px;min-width:42px;justify-content:center;padding:0 16px;border-radius:12px;border:1px solid var(--field);background:transparent;font-weight:600;font-size:14px;transition:transform .2s,background .2s,border-color .2s}
.pg:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink-2);background:color-mix(in srgb,var(--panel),var(--ink) 7%)}
.pg:disabled{opacity:.4}
.pg.num{padding:0}
.pg.num[aria-current="page"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pg.next{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pg.next:disabled{background:transparent;color:var(--ink);border-color:var(--field)}
.pg .ic{width:1.05em;height:1.05em;stroke-width:2.6}

/* Detail */
.banner{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;background:var(--yellow);color:#1B2338;border-radius:14px;padding:12px 18px;font-size:14px;animation:rise .4s both}
.detail{padding:30px}
.d-img{height:235px;border-radius:18px;overflow:hidden;background:var(--bar)}
.d-img img{width:100%;height:100%;object-fit:cover;display:block;animation:imgIn .9s ease both}
@keyframes imgIn{from{transform:scale(1.08);opacity:.4}to{transform:none;opacity:1}}
.detail h2{font-size:24px;font-weight:700;margin-top:16px}
.loc.big{font-size:18px}
.desc.big{font-size:15px;margin-top:6px}
.detail hr{border:0;border-top:3px solid var(--panel-line);margin:18px 0}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.row span{display:inline-flex;align-items:center;gap:12px}
.row .ic{width:1.7em;height:1.7em}
.row b{font-weight:700}
.detail h3,.book h3{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.cp{display:inline-flex;align-items:center;gap:12px;background:var(--chip);color:var(--chip-ink);border:1px solid var(--field);border-radius:999px;padding:4px 18px 4px 4px;font-size:15px;animation:rise .45s both;transition:transform .2s}
.cp:hover{transform:translateY(-2px)}
.cp i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--check);color:#fff}
.cp i .ic{width:18px;height:18px;stroke-width:2.6}
.book{padding:28px 30px 32px;position:relative}
.datebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:14px}
.arr{justify-self:start;width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;border-radius:12px;transition:background .2s,transform .2s}
.arr:last-child{justify-self:end}
.arr .ic{width:1.9em;height:1.9em;stroke-width:1.5}
.arr:hover:not(:disabled){background:color-mix(in srgb,var(--panel),var(--ink) 10%);transform:scale(1.1)}
.arr:disabled{opacity:.25}
.datewrap{position:relative;justify-self:center}
.datepill{display:flex;align-items:center;gap:18px;height:54px;padding:0 18px;border:1.5px solid var(--ink-2);border-radius:16px;background:transparent;font-size:20px;transition:background .2s,box-shadow .2s}
.datepill:hover{background:color-mix(in srgb,var(--panel),#fff 18%);box-shadow:0 4px 14px rgba(20,28,50,.12)}
.datepill .ic{width:1.5em;height:1.5em}
.datepill span{min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums}
.cal{position:absolute;z-index:20;top:calc(100% + 10px);left:50%;translate:-50% 0;width:318px;max-width:92vw;background:var(--bg);border:1px solid var(--field);border-radius:18px;padding:14px;box-shadow:var(--shadow);animation:pop .25s ease both;transform-origin:top center}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-n{width:34px;height:34px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center}
.cal-n:hover:not(:disabled){background:var(--panel)}
.cal-n:disabled{opacity:.25}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-w span{font-size:12px;color:var(--ink-2);padding:4px 0}
.cd{position:relative;height:38px;border-radius:10px;border:1.5px solid transparent;background:transparent;font-size:14px;font-variant-numeric:tabular-nums;transition:background .15s,transform .15s}
.cd:hover:not(:disabled){background:var(--panel);transform:scale(1.08)}
.cd:disabled{opacity:.3}
.cd.today{border-color:var(--ink-2)}
.cd.sel{background:var(--btn);color:var(--btn-ink);font-weight:700}
.cd.dot::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:22px;font-size:17px}
.legend span{display:inline-flex;align-items:center;gap:12px}
.lg{width:30px;height:28px;border-radius:7px;border:1.5px solid;display:block}
.lg.free,.slot.free{background:var(--ok-bg);border-color:var(--ok-line)}
.lg.booked,.slot.booked,.slot.clash{background:var(--bad-bg);border-color:var(--bad-line)}
.lg.mine,.slot.mine{background:var(--mine-bg);border-color:var(--mine-line)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:20px}
.slot{height:68px;border:1px solid;border-radius:16px;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;animation:slotIn .4s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i)*60ms);transition:transform .2s,box-shadow .2s,filter .2s}
@keyframes slotIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slotPop{0%{transform:scale(.92)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
.slots.still .slot{animation:none}
.slots.still .slot.pop{animation:slotPop .5s ease}
.slot.free:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(40,160,110,.25);filter:brightness(1.04)}
.slot.free:active{transform:scale(.97)}
.slot.booked,.slot.clash{cursor:not-allowed;color:var(--ink-2)}
.slot.mine{font-weight:600;box-shadow:inset 0 0 0 1px var(--mine-line)}
.slot.past{background:transparent;border-color:var(--field);border-style:dashed;color:var(--ink-2);opacity:.55;cursor:not-allowed}

/* Booking Saya */
.head{padding:36px 36px}
.head h2{font-size:24px;font-weight:700}
.bk{padding:34px;display:block;animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*80ms);transition:opacity .3s,transform .3s,max-height .35s,margin .3s,padding .3s}
.bk.leaving{opacity:0;transform:scale(.96) translateY(-8px);pointer-events:none}
.bk.flash{animation:cardIn .5s both,flash 1.8s ease .3s}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--yellow),transparent 40%)}}
.bk-img{height:235px;border-radius:18px;overflow:hidden;background:var(--bar)}
.bk-img img{width:100%;height:100%;object-fit:cover;display:block}
.bk h3{font-size:24px;font-weight:700;margin-top:16px}
.bk .loc{font-size:18px}
.bk .desc{font-size:15px}
.bk-a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:18px;align-items:center;margin-top:14px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:14px;height:54px;padding:0 16px;border:1px solid var(--ink-2);border-radius:16px;font-size:19px;font-variant-numeric:tabular-nums}
.pill .ic{width:1.5em;height:1.5em}
.pill.c{justify-content:center}
.btn-ok{height:54px;padding:0 38px;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:16px;font-size:18px;font-weight:500;transition:transform .2s,box-shadow .2s,filter .2s}
.btn-ok:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,160,110,.25);filter:brightness(1.04)}
.btn-ok:disabled{opacity:.45;background:transparent;border-color:var(--field);border-style:dashed}
.trash{width:46px;height:46px;display:grid;place-items:center;background:transparent;border:0;border-radius:12px;color:var(--danger);transition:transform .2s,background .2s}
.trash .ic{width:1.9em;height:1.9em}
.trash:hover{background:color-mix(in srgb,var(--danger),transparent 86%);transform:rotate(-8deg) scale(1.1)}
.trash:active{transform:scale(.92)}
.done-tag{display:inline-block;margin-left:10px;font-size:12px;font-weight:600;background:var(--bar);padding:2px 10px;border-radius:999px;vertical-align:middle}

/* Dialog + toast */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,14,26,.66);display:grid;place-items:center;padding:16px;animation:fade .2s both}
.scrim.out{opacity:0;transition:opacity .18s}
.dialog{position:relative;width:min(100%,560px);background:var(--panel);color:var(--ink);border-radius:24px;padding:38px 32px 32px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:pop .32s cubic-bezier(.2,1.1,.4,1) both}
.scrim.out .dialog{transform:scale(.95);transition:transform .18s}
.dlg-x{position:absolute;top:14px;right:14px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--link);transition:background .2s,transform .2s}
.dlg-x:hover{background:color-mix(in srgb,var(--panel),var(--ink) 10%);transform:rotate(90deg)}
.dlg-x .ic{width:1.5em;height:1.5em;stroke-width:2.6}
.dlg-ic{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;background:var(--icon-bg);color:#fff;display:grid;place-items:center;animation:pop .5s .08s both}
.dialog.danger .dlg-ic{background:var(--danger)}
.dlg-ic .ic{width:46px;height:46px;stroke-width:2.6}
.dialog h2{font-size:24px;font-weight:700;line-height:1.3}
.dlg-l{margin-top:22px;font-size:17px;font-weight:700}
.dlg-v{margin-top:18px;font-size:20px;font-weight:700;color:var(--link);line-height:1.4}
.dlg-n{margin-top:10px;font-size:14px;color:var(--ink-2)}
.dlg-b{display:flex;justify-content:center;gap:24px;margin-top:28px;flex-wrap:wrap}
.dialog.danger .btn-f{background:var(--danger);border-color:var(--danger);color:#fff}
.toasts{position:fixed;left:50%;translate:-50% 0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:16px;background:var(--navy);color:var(--side-ink);border:1px solid var(--navy-line);border-radius:14px;padding:12px 18px;font-size:14px;box-shadow:var(--shadow);animation:toastIn .35s cubic-bezier(.2,1,.3,1) both}
.toast.out{opacity:0;transform:translateY(10px);transition:all .25s}
.toast button{background:none;border:0;color:var(--yellow);font-weight:700;padding:0;white-space:nowrap}
.toast button:hover{text-decoration:underline}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- Responsif ---------- */
@media (max-width:1000px){
  .filters{grid-template-columns:minmax(0,1fr) 1fr 1fr}
  .filters .fld-q{grid-column:1/-1}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bk-a{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bk-a .btn-ok{grid-column:1/2}
  .bk-a .trash{justify-self:start}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo acc" "nav nav";align-items:center;gap:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;overflow:visible}
  .sp{padding-left:0;padding-right:0}
  .logo{grid-area:logo;border:0;padding:0;text-align:left;font-size:24px}
  .sec.acc{grid-area:acc;border:0;padding:0}
  .sec.gen{grid-area:nav;padding:8px 0 0}
  .lab{display:none}
  .chip{width:auto;padding:5px 10px 5px 5px;gap:8px}
  .chip b{font-size:14px}
  .avatar{width:32px;height:32px}
  .menu{left:auto;right:0;width:230px}
  .gen nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .nv{margin:0;justify-content:center;font-size:15px;padding:8px 10px;background:rgba(255,255,255,.06)}
  .nv[aria-current="page"]{background:rgba(255,255,255,.16)}
  .nv:hover{transform:none}
  .nv .ic{width:1.25em;height:1.25em}
  .nv span:not(.badge){white-space:nowrap}
  .nv{font-size:14px;gap:8px;padding:8px 6px}
  .badge{margin-left:4px;min-width:20px;height:20px;font-size:11px}
  .main{padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:minmax(0,1fr)}
  .hero{padding:20px 18px 22px;min-height:0}
  .brand{font-size:32px}.lead{font-size:15px}.sub{font-size:16px}
  .panel{padding:18px;border-radius:18px}
  .detail,.book,.bk{padding:18px}
  .head{padding:22px 18px}
  .d-img,.bk-img{height:170px}
  .list-h h2{font-size:20px}
  .detail h2,.bk h3,.head h2{font-size:21px}
  .datebar{grid-template-columns:auto minmax(0,1fr) auto;gap:6px}
  .datepill{font-size:16px;gap:10px;padding:0 12px}
  .datepill span{min-width:6.4em}
  .legend{font-size:14px;gap:10px 20px}
  .slots{gap:12px}
  .slot{font-size:14px;height:60px}
  .bk-a{grid-template-columns:minmax(0,1fr)}
  .pill{font-size:16px}
  .btn-ok{width:100%}
  .dialog{padding:34px 20px 24px}
  .dialog h2{font-size:20px}
  .dlg-v{font-size:17px}
  .dlg-b{gap:12px}.dlg-b button{flex:1;padding:0 12px}
  .pager{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

function box(x,y,w,h,col,r){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r==null?Math.min(w,h)/3:r}" fill="${col}"/>`}

const PAGE_SIZE=4;
const KEY='sipadedi.booking.v1';
const SLOTS=[['06:00','09:00'],['10:00','12:00'],['13:00','15:00'],['16:00','18:00']];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const isoOf=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return isoOf(d)};
const short=s=>{const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const long=s=>{const d=parse(s);return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`};
const slotLabel=i=>`${SLOTS[i][0]} - ${SLOTS[i][1]} WIB`;
const TODAY=isoOf(new Date());
function isPast(date,i){
  if(date<TODAY)return true; if(date>TODAY)return false;
  const n=new Date(),[h,m]=SLOTS[i][0].split(':').map(Number);
  return n.getHours()*60+n.getMinutes()>=h*60+m;
}
const MIN=SLOTS.every((_,i)=>isPast(TODAY,i))?addDays(TODAY,1):TODAY;
function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const takenByOthers=(fid,date,i)=>h32(fid+'|'+date+'|'+i)%100<30;
const uid=()=>'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ================= State ================= */
const seed=()=>[{id:uid(),fid:'lab-komputer',date:addDays(MIN,3),slot:2}];

const S={view:'home',page:1,q:'',cat:'all',cap:'all',fid:null,date:MIN,editId:null,backTo:'home',menu:false,cal:null,flash:null,bookings:load()||seed()};
function save(){try{localStorage.setItem(KEY,JSON.stringify({b:S.bookings}))}catch(e){}}
save();
const findB=id=>S.bookings.find(b=>b.id===id);

function slotState(fid,date,i){
  const mine=S.bookings.find(b=>b.fid===fid&&b.date===date&&b.slot===i);
  if(mine)return{k:'mine',b:mine};
  if(isPast(date,i))return{k:'past'};
  if(takenByOthers(fid,date,i))return{k:'booked'};
  const clash=S.bookings.find(b=>b.date===date&&b.slot===i&&b.fid!==fid);
  if(clash)return{k:'clash',b:clash};
  return{k:'free'};
}

    </header>
    <div class="panel filters">
      <label class="fld fld-q"><span class="sr">Cari fasilitas</span><input id="q" type="text" placeholder="Cari fasilitas, contoh: LAB RPL 9, Hall SV…" value="${esc(S.q)}" autocomplete="off">${I.search}</label>
      <label class="fld"><span class="sr">Kategori</span><select id="cat"><option value="all">Semua Kategori</option>${CATS.map(c=>`<option value="${esc(c)}" ${S.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>${I.down}</label>
      <label class="fld"><span class="sr">Kapasitas</span><select id="cap">${[['all','Semua Kapasitas'],['sm','Hingga 30 orang'],['md','31 – 60 orang'],['lg','Lebih dari 60 orang']].map(([v,t])=>`<option value="${v}" ${S.cap===v?'selected':''}>${t}</option>`).join('')}</select>${I.down}</label>
    </div>
    <div class="panel" id="listp"><div class="list-h"><h2>Daftar Fasilitas DTEDI SV UGM</h2><span class="count" id="count"></span></div><div class="grid" id="grid"></div><div class="pager" id="pager"></div></div>
  </section>`;
  renderList(0);
}

/* ================= Detail + sesi ================= */
function slotsHTML(anim,pop){
  return SLOTS.map((_,i)=>{
    const st=slotState(S.fid,S.date,i);
    const cls={free:'free',booked:'booked',clash:'clash',mine:'mine',past:'past'}[st.k];
    const tip={free:'Tersedia',booked:'Sudah dibooking pengguna lain',clash:'Kamu sudah punya booking di jam ini',mine:'Booking kamu',past:'Sesi sudah lewat'}[st.k];
    return `<button class="slot ${cls}${pop===i?' pop':''}" style="--i:${i}" data-act="slot" data-i="${i}" ${st.k==='booked'||st.k==='past'||st.k==='clash'?'aria-disabled="true"':''} title="${tip}" aria-label="${slotLabel(i)}, ${tip}">${slotLabel(i)}</button>`;
  }).join('');
}
function refreshDate(anim=true,pop=-1){
  $('#dateText').textContent=short(S.date);
  $('#prevDay').disabled=S.date<=MIN;
  const el=$('#slots');el.classList.toggle('still',!anim);el.innerHTML=slotsHTML(anim,pop);
}
function paintCal(){
  const h=$('#calHost');if(!h)return;
  h.innerHTML=S.cal?calHTML():'';
  const b=$('.datepill');if(b)b.setAttribute('aria-expanded',!!S.cal);
}
function calHTML(){
  const {y,m}=S.cal,lead=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  const atMin=(y*12+m)<=(+MIN.slice(0,4)*12+ +MIN.slice(5,7)-1);
  let c='';for(let i=0;i<lead;i++)c+='<span></span>';
  for(let d=1;d<=n;d++){
    const s=`${y}-${p2(m+1)}-${p2(d)}`;
    const cls=['cd',s===S.date?'sel':'',s===TODAY?'today':'',S.bookings.some(b=>b.fid===S.fid&&b.date===s)?'dot':''].join(' ');
    c+=`<button type="button" class="${cls}" data-act="calday" data-d="${s}" ${s<MIN?'disabled':''}>${d}</button>`;
  }
  return `<div class="cal" role="dialog" aria-label="Pilih tanggal"><div class="cal-h"><button type="button" class="cal-n" data-act="calmonth" data-n="-1" ${atMin?'disabled':''} aria-label="Bulan sebelumnya">${I.left}</button><b>${BULAN[m]} ${y}</b><button type="button" class="cal-n" data-act="calmonth" data-n="1" aria-label="Bulan berikutnya">${I.right}</button></div><div class="cal-w">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${c}</div></div>`;
}
function renderDetail(){
  const f=FAC(S.fid),b=S.editId?findB(S.editId):null;
  $('#view').innerHTML=`<section class="view">
    <div><button class="back" data-act="back">${I.left}<span>Kembali</span></button></div>
    ${b?`<div class="banner"><b>Mode ubah sesi</b><span>Sesi kamu saat ini: ${long(b.date)} - ${slotLabel(b.slot)}. Pilih sesi baru di bawah.</span></div>`:''}
    <div class="panel detail">
      <div class="d-img"><img src="${img(f,'banner')}" alt="${esc(f.name)}"></div>
      <h2>${esc(f.name)}</h2><p class="loc big">${I.pin}<span>${esc(f.loc)}</span></p><p class="desc big">${esc(f.desc)}</p>
      <hr>
      <div class="rows"><div class="row"><span>${I.people}Kapasitas</span><b>${f.cap} Orang</b></div><div class="row"><span>${I.person}Pengelola</span><b>${esc(f.mgr)}</b></div></div>
      <hr>
      <h3>Fasilitas</h3>
      <div class="chips">${f.fas.map((x,i)=>`<span class="cp" style="animation-delay:${i*70}ms"><i>${I.check}</i>${esc(x)}</span>`).join('')}</div>
    </div>
    <div class="panel book">
      <h3>${b?'Ubah Sesi Booking':'Ajukan Booking'}</h3>
      <div class="datebar">
        <button class="arr" id="prevDay" data-act="day" data-n="-1" aria-label="Hari sebelumnya">${I.left}</button>
        <div class="datewrap"><button class="datepill" data-act="cal" aria-haspopup="dialog" aria-expanded="false" aria-label="Pilih tanggal">${I.calF}<span id="dateText"></span>${I.calO}</button><div id="calHost"></div></div>
        <button class="arr" data-act="day" data-n="1" aria-label="Hari berikutnya">${I.right}</button>
      </div>
      <div class="legend"><span><i class="lg free"></i>Available</span><span><i class="lg booked"></i>Booked</span><span><i class="lg mine"></i>Yours</span></div>
      <div class="slots" id="slots"></div>
    </div></section>`;
  refreshDate();
}

/* ================= Booking Saya ================= */
function bkHTML(b,i){
  const f=FAC(b.fid),done=b.date<TODAY;
  return `<article class="panel bk${S.flash===b.id?' flash':''}" style="--i:${i}" data-bk="${b.id}">
    <div class="bk-img"><img src="${img(f,'banner')}" alt="${esc(f.name)}"></div>
    <h3>${esc(f.name)}${done?'<span class="done-tag">Selesai</span>':''}</h3>
    <p class="loc">${I.pin}<span>${esc(f.loc)}</span></p><p class="desc">${esc(f.desc)}</p>
    <div class="bk-a">
      <div class="pill">${I.calF}<span>${short(b.date)}</span>${I.calO}</div>
      <div class="pill c">${slotLabel(b.slot)}</div>
      <button class="btn-ok" data-act="edit" data-id="${b.id}" ${done?'disabled title="Sesi sudah berlalu"':''}>Edit Booking</button>
      <button class="trash" data-act="del" data-id="${b.id}" aria-label="Batalkan booking ${esc(f.name)}">${I.trash}</button>
    </div></article>`;
}
function renderBookings(){
  const list=[...S.bookings].sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  $('#view').innerHTML=`<section class="view">
    <div><button class="back" data-act="back">${I.left}<span>Kembali</span></button></div>
    <div class="panel head"><h2>Booking Saya</h2></div>
    ${list.length?list.map(bkHTML).join(''):`<div class="panel"><div class="empty"><b>Belum ada booking</b><p>Pilih fasilitas di Beranda, lalu ambil sesi yang masih tersedia. Booking kamu akan muncul di sini.</p><button class="btn-f" data-act="nav" data-to="home">Pilih Fasilitas</button></div></div>`}
  </section>`;
  S.flash=null;
}

/* ================= Render + navigasi ================= */
function render(){
  if(S.view==='home')renderHome();else if(S.view==='detail')renderDetail();else renderBookings();
  updateNav();window.scrollTo(0,0);
}
function go(v){S.view=v;S.cal=null;render()}

/* ================= Dialog + toast ================= */
function ask({title,label,value,note,yes='Yakin',no='Batal',danger=false}){
  return new Promise(res=>{
    const root=$('#overlay'),prev=document.activeElement;
    root.innerHTML=`<div class="scrim"><div class="dialog${danger?' danger':''}" role="dialog" aria-modal="true" aria-labelledby="dt">
      <button class="dlg-x" aria-label="Tutup">${I.x}</button><div class="dlg-ic">${I.q}</div>
      <h2 id="dt">${esc(title)}</h2>${label?`<p class="dlg-l">${esc(label)}</p>`:''}${value?`<p class="dlg-v">${esc(value)}</p>`:''}${note?`<p class="dlg-n">${esc(note)}</p>`:''}
      <div class="dlg-b"><button class="btn-o" data-no>${esc(no)}</button><button class="btn-f" data-yes>${esc(yes)}</button></div></div></div>`;
    const sc=$('.scrim',root),dlg=$('.dialog',root);let done=false;
    const close=async v=>{if(done)return;done=true;document.removeEventListener('keydown',onKey,true);sc.classList.add('out');await sleep(190);root.innerHTML='';if(prev&&prev.focus)prev.focus();res(v)};
    const onKey=e=>{
      if(e.key==='Escape'){e.preventDefault();close(false)}
      else if(e.key==='Tab'){const bs=[...dlg.querySelectorAll('button')],i=bs.indexOf(document.activeElement);e.preventDefault();bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus()}
    };
    document.addEventListener('keydown',onKey,true);
    sc.addEventListener('click',e=>{if(e.target===sc)close(false)});
    $('[data-yes]',dlg).onclick=()=>close(true);$('[data-no]',dlg).onclick=()=>close(false);$('.dlg-x',dlg).onclick=()=>close(false);
    $('[data-yes]',dlg).focus();
  });
}
function toast(msg,act){
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove();
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span>${esc(msg)}</span>${act?`<button data-act="toastgo" data-to="${act.to}">${esc(act.label)}</button>`:''}`;
  box.append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},3800);
}

/* ================= Aksi booking ================= */
async function pickSlot(i){
  const st=slotState(S.fid,S.date,i);
  if(st.k==='booked')return toast('Sesi ini sudah dibooking pengguna lain.');
  if(st.k==='past')return toast('Sesi ini sudah lewat. Pilih sesi atau tanggal lain.');
  if(st.k==='clash')return toast(`Kamu sudah punya booking di jam yang sama (${FAC(st.b.fid).name}).`);
  if(st.k==='mine'){
    return st.b.id===S.editId?toast('Ini sesi booking kamu saat ini. Pilih sesi lain untuk menggantinya.')
      :toast('Sesi ini sudah kamu booking.',{label:'Lihat',to:'bookings'});
  }
  const val=`${long(S.date)} - ${slotLabel(i)}`;
  if(S.editId){
    const b=findB(S.editId);if(!b)return;
    const ok=await ask({title:'Apakah kamu yakin ingin mengubah sesi?',label:'Sesi Baru Anda:',value:val,note:`Sesi lama: ${long(b.date)} - ${slotLabel(b.slot)}`,yes:'Yakin'});
    if(!ok)return;
    b.date=S.date;b.slot=i;save();S.flash=b.id;S.editId=null;
    go('bookings');toast('Sesi booking berhasil diubah.');
  }else{
    const ok=await ask({title:'Apakah kamu yakin ingin memilih sesi ini?',label:'Pilihan Sesi Anda:',value:val});
    if(!ok)return;
    if(slotState(S.fid,S.date,i).k!=='free')return toast('Sesi ini baru saja tidak tersedia.');
    S.bookings.push({id:uid(),fid:S.fid,date:S.date,slot:i});save();
    refreshDate(false,i);updateNav(true);
    toast('Sesi tersimpan di Booking Saya.',{label:'Lihat',to:'bookings'});
  }
}
async function removeBooking(id){
  const b=findB(id);if(!b)return;
  const ok=await ask({title:'Batalkan booking ini?',label:FAC(b.fid).name,value:`${long(b.date)} - ${slotLabel(b.slot)}`,yes:'Ya, batalkan',no:'Tidak',danger:true});
  if(!ok)return;
  const card=$(`[data-bk="${id}"]`);if(card){card.classList.add('leaving');await sleep(320)}
  S.bookings=S.bookings.filter(x=>x.id!==id);save();
  renderBookings();updateNav();toast('Booking dibatalkan.');
}
async function resetData(){
  setMenu(false);
  const ok=await ask({title:'Atur ulang data booking?',label:'Semua booking kamu akan dihapus dan contoh awal dipulihkan.',yes:'Atur ulang',no:'Batal',danger:true});
  if(!ok)return;
  S.bookings=seed();save();S.editId=null;go('home');toast('Data booking diatur ulang.');
}

/* ================= Event ================= */
document.addEventListener('click',e=>{
  if(S.cal&&!e.target.closest('.datewrap')){S.cal=null;paintCal()}
  if(S.menu&&!e.target.closest('.accwrap'))setMenu(false);
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='nav'){S.editId=null;S.backTo='home';go(t.dataset.to)}
  else if(a==='toastgo'){S.editId=null;go(t.dataset.to);t.closest('.toast').remove()}
  else if(a==='menu')setMenu(!S.menu);
  else if(a==='reset')resetData();
  else if(a==='open'){S.fid=t.dataset.id;S.date=MIN;S.editId=null;S.backTo='home';go('detail')}
  else if(a==='back'){S.editId=null;go(S.view==='detail'?S.backTo:'home')}
  else if(a==='clear'){S.q='';S.cat='all';S.cap='all';S.page=1;renderHome()}
  else if(a==='page'){
    const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
    const p=t.dataset.p,np=p==='prev'?S.page-1:p==='next'?S.page+1:+p;
    if(np<1||np>pages||np===S.page)return;
    const dir=np>S.page?1:-1;S.page=np;renderList(dir);
    const lp=$('#listp');if(lp)lp.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
  }
  else if(a==='day'){const d=addDays(S.date,+t.dataset.n);if(d<MIN)return;S.date=d;refreshDate();if(S.cal){S.cal={y:+d.slice(0,4),m:+d.slice(5,7)-1};paintCal()}}
  else if(a==='cal'){const d=parse(S.date);S.cal=S.cal?null:{y:d.getFullYear(),m:d.getMonth()};paintCal()}
  else if(a==='calmonth'){const d=new Date(S.cal.y,S.cal.m+ +t.dataset.n,1);S.cal={y:d.getFullYear(),m:d.getMonth()};paintCal()}
  else if(a==='calday'){S.date=t.dataset.d;S.cal=null;paintCal();refreshDate()}
  else if(a==='slot')pickSlot(+t.dataset.i);
  else if(a==='edit'){
    const b=findB(t.dataset.id);if(!b)return;
    S.fid=b.fid;S.date=b.date<MIN?MIN:b.date;S.editId=b.id;S.backTo='bookings';go('detail');
  }
  else if(a==='del')removeBooking(t.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.cal){S.cal=null;paintCal()}if(S.menu)setMenu(false)}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;renderList(0)}});
document.addEventListener('change',e=>{
  if(e.target.id==='cat'){S.cat=e.target.value;S.page=1;renderList(0)}
  if(e.target.id==='cap'){S.cap=e.target.value;S.page=1;renderList(0)}
});

render();
})();
</script>

</body></html>
